<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로또 번호 추첨기</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1928124186162556"
     crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>로또 번호 추첨기</h1>
        <div class="lotto-numbers"></div>
        <button id="generate-btn">번호 추첨</button>
        <button id="theme-toggle">다크 모드</button>

        <hr style="margin: 2rem 0; border: 0; border-top: 1px solid #ddd;">

        <section class="contact-form">
            <h2>제휴 문의</h2>
            <form action="https://formspree.io/f/xnjlyear" method="POST">
                <div class="form-group">
                    <input type="email" name="email" placeholder="이메일 주소" required>
                </div>
                <div class="form-group">
                    <textarea name="message" placeholder="문의 내용을 입력해 주세요" required></textarea>
                </div>
                <button type="submit" id="submit-btn">문의 보내기</button>
            </form>
        </section>
    </div>
    <script src="main.js"></script>
</body>
</html>
